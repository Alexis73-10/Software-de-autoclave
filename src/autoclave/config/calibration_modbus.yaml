        gain: 1.0
        offset: 0.0

      - adc_min: 0
        adc_max: 1000
        temp_min: 0
        temp_max: 100
        gain: 1.0
        offset: 0.0

    pressure:
      - adc_min: 4000
        adc_max: 20000
        pres_min: 0
