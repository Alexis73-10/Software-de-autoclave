# Tanda 19 (MOD-04): calibración de fábrica del enlace Modbus TCP (módulos
# Ebyte M31-U). Mismo formato que calibration.yaml (la escribe
# config/calibration_writer.py con ruamel); utils/paths.calibration_path() la
# elige cuando el enlace activo (config/enlace_io.json) es "modbus".
#
# temperature[i] = PT100 i+1 del módulo M31-GXDXX0600-U, entero con signo en
#   décimas de °C: adc_min 0 / adc_max 1000 -> temp_min 0 / temp_max 100 es la
#   identidad (décimas -> °C; 0 = 0,0 °C y los negativos valen). Los canales 6
#   y 7 no tienen puerto (el enlace los entrega como None); se dejan con la
#   misma escala porque la calibración es posicional.
# pressure[i] = AI i+1 del principal (puertos 09-16), en µA, transmisores de
#   0-4 bar abs (4-20 mA): 4000 / 20000 µA -> 0 / 400 kPa abs. Umbrales de falla
#   de lazo con los márgenes por defecto: 3600 y 21000 µA. adc_piso_senal 3850:
#   por debajo de 3,85 mA el módulo entrega 0 (DECISIÓN SIN CONFIRMAR).
# La calibración de usuario es neutra (offset 0, gain 1): se ajusta en sitio.
name: "Calibracion Sensores Modbus M31"
sampling_interval_ms: 500

calibration:
  factory:
    temperature:
      - adc_min: 0
        adc_max: 1000
        temp_min: 0
        temp_max: 100
        gain: 1.0
        offset: 0.0

      - adc_min: 0
        adc_max: 1000
        temp_min: 0
