instance:
  serial_number: ACV-2026-001
  installation_date: 2026-02-07

model:
  model_family: Vapor
  model_name: SOLIDS

configuration:
  doors:
    count: 2
  steam_supply:
    mode: generator
  cooling:
    enabled: false

# D8-3.17 (tanda 8): máximo físico de la tarjeta. Los canales que se muestran
# se derivan del perfil de instalación (temperature_probes, supply_inputs,
# door_count/door_type, vapor_source; core/runtime/io_names.py): un canal que
# el perfil no declara no aparece. No hace falta editar esta lista por equipo.
io_enabled:
  AI:
    - temp_camara
    - temp_2_camara
    - temp_referencia
    - temp_drenaje_camara
    - temp_drenaje
    - pres_camara
    - pres_chaqueta
    - pres_empaque_1
    - pres_empaque_2
  DI:
    - aire_comprimido
    - presion_agua
    - puerta_1_cerrada
    - puerta_1_abierta
    - puerta_2_cerrada
    - puerta_2_abierta
    - atrapamiento_puerta_1
    - atrapamiento_puerta_2
    - agua_bomba
    - agua_generador
    - paro_emergencia
    - agua_camara
    - vapor_suministro
    - suministro_electrico
  DO:
    - vapor_generador
    - vapor_caldera
    - vapor_chaqueta
    - vapor_camara
    - descompresion_rapida
    - descompresion_lenta
    - descompresion_chaqueta
    - vacio_camara
    - desbloqueo_puerta_1
    - desbloqueo_puerta_2
    - bloqueo_puerta_1
    - bloqueo_puerta_2
    - aire_comprimido_camara
    - aire_atmosferico_camara
    - agua_chaqueta
    - agua_intercambiador
    - agua_bomba
    - bomba_vacio
    - abrir_puerta_1
    - abrir_puerta_2
    - cerrar_puerta_1
    - cerrar_puerta_2
    - buzer_alarma

# D9-5 (tanda 9): tipo de contacto de cada entrada digital del máximo físico.
# nc: true = contacto normalmente cerrado (1 = inactiva; 0 o circuito abierto =
# activa). Opciones > Entradas / Salidas muestra de las NC el estado
# interpretado y el nivel crudo al lado. Son NC el paro de emergencia y el
# seguro de atrapamiento de cada puerta (este solo aparece si el perfil tiene
# puertas con atrapamiento). Solo presentación: la lógica del paro y del
# atrapamiento ya trata esas entradas como NC en el código.
di_contacto:
  aire_comprimido: {nc: false}
  presion_agua: {nc: false}
  puerta_1_cerrada: {nc: false}
  puerta_1_abierta: {nc: false}
  puerta_2_cerrada: {nc: false}
  puerta_2_abierta: {nc: false}
  atrapamiento_puerta_1: {nc: true}
  atrapamiento_puerta_2: {nc: true}
  agua_bomba: {nc: false}
  agua_generador: {nc: false}
  paro_emergencia: {nc: true}
  agua_camara: {nc: false}
  vapor_suministro: {nc: false}
  suministro_electrico: {nc: false}

# R8 (tanda 8, D8-5.12): asignación de FÁBRICA de cada función a su puerto de
# la tarjeta (numerados desde 1, como en Opciones > Entradas / Salidas). La
# vigente se guarda aparte, en data/asignacion_io.json de la carpeta de datos
# (Opciones avanzadas, solo el ingeniero); sin ella rige esta. Bajo AI, la
# temperatura va en RTD 01-06 (módulo de 6 PT100) y la presión en AI 01-16
# (AI 1-16 del principal); tanda 23 (AIN-01/02): antes la presión se numeraba
# AI 09-16 (AI 09 de entonces = AI 01 de ahora, el mismo canal físico).
# DI 01-16. Si esta sección falta, rige la del código.
io_ports:
  DI:
    aire_comprimido: 1
    presion_agua: 2
    puerta_1_cerrada: 3
    puerta_1_abierta: 4
    puerta_2_cerrada: 5
    puerta_2_abierta: 6
    atrapamiento_puerta_1: 7
    atrapamiento_puerta_2: 8
    agua_bomba: 9
    agua_generador: 10
    paro_emergencia: 11
    agua_camara: 12
    vapor_suministro: 13
    suministro_electrico: 14
  DO:
    vapor_generador: 1
    vapor_caldera: 2
    vapor_chaqueta: 3
    vapor_camara: 4
    descompresion_rapida: 5
    descompresion_lenta: 6
    descompresion_chaqueta: 7
    vacio_camara: 8
    desbloqueo_puerta_1: 9
    desbloqueo_puerta_2: 10
    bloqueo_puerta_1: 11
    bloqueo_puerta_2: 12
    aire_comprimido_camara: 14
    aire_atmosferico_camara: 15
    agua_chaqueta: 16
    agua_intercambiador: 17
    agua_bomba: 18
    bomba_vacio: 19
    abrir_puerta_1: 20
    abrir_puerta_2: 21
    cerrar_puerta_1: 22
    cerrar_puerta_2: 23
    # Tanda 19 (decisión 4 de Cristian, MOD-05): buzzer de 24 VDC en DO 25
    # (antes 24), fuera del grupo 17-24; aplica a los dos enlaces de E/S.
    buzer_alarma: 25
  AI:
    temp_camara: 1
    temp_2_camara: 2
    temp_referencia: 3
    temp_drenaje: 5
    pres_camara: 1
    pres_chaqueta: 2
    pres_empaque_1: 3
