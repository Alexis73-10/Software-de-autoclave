# D8-3.18 (tanda 8): calibración NEUTRA que viaja en la entrega. Autoclave.spec la
# empaqueta como autoclave/config/calibration.yaml (en un equipo nuevo se siembra
# en data/calibration.yaml). La sección factory es idéntica a la de
# config/calibration.yaml (escala ADC de cada canal); la de usuario queda en
# ganancia 1.0 y offset 0.0, igual que "Restaurar por defecto": cada sensor se
# calibra en sitio. tools/verificar_calibracion_neutra.py comprueba el resultado
# del build y tests/test_t8_k8_calibracion_neutra.py que no se desalineen.
# temperature[3] (en factory y en user) es la posición del sensor temp_chaqueta,
# retirado de todos los equipos (T-19). No borrarla: la calibración es posicional
# y quitarla correría la de temp_drenaje (4). temperature[5] queda sin sensor:
# temp_drenaje_cam ya no existe y su entrada (4) la ocupa temp_drenaje (2026-10-12).
name: "Calibracion Sensores PRO"
sampling_interval_ms: 500

calibration:
